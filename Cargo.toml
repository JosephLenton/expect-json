[workspace]
members = ["expect-json", "expect-json-macros"]
resolver = "2"

[workspace.package]
authors = ["Joseph Lenton <josephlenton@gmail.com>"]
version = "1.11.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
keywords = ["testing", "test", "json", "serde_json"]
categories = ["development-tools::testing", "development-tools"]
repository = "https://github.com/JosephLenton/expect-json"
publish = true

[workspace.dependencies]
expect-json = { version = "1.11.0", path = "./expect-json" }
expect-json-macros = { version = "1.11.0", path = "./expect-json-macros" }

email_address = "0.2.9"
jiff = { version = "1.0.0", default-features = false }
num = "0.4.3"
serde = "1.0.228"
serde_json = "1.0.150"
typetag = "0.2.22"
thiserror = "2.0.18"
uuid = "1.23.1"
regex = "1.12.3"

proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.117"

pretty_assertions = "1.4.1"
rstest = "0.26.1"

# For Documentation
axum = "0.8.9"
axum-test = { version = "20.0.0", path = "../axum-test" }
